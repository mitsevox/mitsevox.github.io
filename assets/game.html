<main>
<h1 class="sr-only">Decompilation progress</h1>
<section class="progress" aria-label="Build progress"></section>
<div class="stats-grid"><section class="function-stats" data-stats="function"></section><section class="function-stats" data-stats="file"></section></div>
<section id="project-map" data-kind="code" aria-label="Project map"><div class="map-controls"><div data-ui="map-search"></div><div data-ui="map-kind"></div></div><div class="map-view"><div id="canvas" class="canvas" aria-label="Code file map"></div><span data-ui="map-back"></span></div><div data-ui="map-tooltip"></div><aside id="map-details" class="map-details" aria-labelledby="map-details-title" hidden><div class="map-details-heading"><h3 id="map-details-title"></h3><span data-ui="map-close"></span></div><dl></dl></aside></section>
<section class="history-section" aria-labelledby="history-title">
<h2 id="history-title">Progress</h2>
<div class="history-summary"><span><i class="code-line-key"></i>Code <strong data-history-value="code"></strong></span><span><i class="data-line-key"></i>Data <strong data-history-value="data"></strong></span><time id="history-date"></time></div>
<div class="history-chart"><svg viewBox="0 0 1000 220" preserveAspectRatio="none" role="img" aria-label="Code and data linked progress over time"><g class="chart-guides"><path d="M0 20H1000 M0 80H1000 M0 140H1000 M0 200H1000"/></g><path class="history-line code-line" data-line="code"/><path class="history-line data-line" data-line="data"/><line id="history-cursor" y1="10" y2="200"/><circle data-dot="code" r="4"/><circle data-dot="data" r="4"/></svg><span class="history-ceiling"></span><span data-ui="history-scrub"></span></div><div class="history-axis"><span></span><span></span><span></span></div>
</section>
<section class="people-section" aria-labelledby="people-title"><h2 id="people-title">Contributors</h2><ol class="contributor-rankings" aria-label="Contributor rankings by credited compiled functions"></ol></section>
<section class="lower"><div><h3>Want to join the effort?</h3></div><span data-ui="contribution-link"></span></section>
</main>
