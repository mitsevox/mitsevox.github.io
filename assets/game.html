<main>
<h1 class="sr-only">Decompilation progress</h1>
<section class="progress" aria-label="Build progress">
<div class="progress-element" data-progress="code"><div class="progress-heading"><h2>Code</h2><span class="progress-value">—</span></div><div class="track" role="progressbar" tabindex="0" aria-label="Code progress" aria-valuemin="0" aria-valuemax="100" aria-valuetext="Loading"><i class="progress-fuzzy"></i><i class="progress-matched"></i><i class="progress-linked"></i></div><div class="progress-key" aria-hidden="true"><span><i class="linked-key"></i>Linked</span><span><i class="matched-key"></i>Matched</span><span><i class="fuzzy-key"></i>Fuzzy</span></div></div>
<div class="progress-element" data-progress="data"><div class="progress-heading"><h2>Data</h2><span class="progress-value">—</span></div><div class="track" role="progressbar" tabindex="0" aria-label="Data progress" aria-valuemin="0" aria-valuemax="100" aria-valuetext="Loading"><i class="progress-fuzzy"></i><i class="progress-matched"></i><i class="progress-linked"></i></div><div class="progress-key" aria-hidden="true"><span><i class="linked-key"></i>Linked</span><span><i class="matched-key"></i>Matched</span><span><i class="fuzzy-key"></i>Fuzzy</span></div></div>
</section>
<div class="stats-grid">
<section class="function-stats" data-stats="function" aria-labelledby="functions-title"><div class="stats-heading"><h2 id="functions-title">Functions</h2><span class="stats-total"><span>—</span> total</span></div>
<div class="function-stat" data-function="exact"><div class="stat-heading"><h3>Exact</h3><div class="function-count"><strong id="functions-exact">—</strong></div></div><div class="function-track" role="progressbar" aria-label="Functions exact" aria-valuemin="0" aria-valuemax="100" aria-valuetext="Loading"><i></i></div></div>
<div class="function-stat" data-function="named"><div class="stat-heading"><h3>Named</h3><div class="function-count"><strong id="functions-named">—</strong></div></div><div class="function-track" role="progressbar" aria-label="Functions named" aria-valuemin="0" aria-valuemax="100" aria-valuetext="Loading"><i></i></div></div>
</section>
<section class="function-stats" data-stats="file" aria-labelledby="files-title"><div class="stats-heading"><h2 id="files-title">Files</h2><span class="stats-total"><span>—</span> total</span></div>
<div class="function-stat" data-file="exact"><div class="stat-heading"><h3>Exact</h3><div class="function-count"><strong id="files-exact">—</strong></div></div><div class="function-track" role="progressbar" aria-label="Files exact" aria-valuemin="0" aria-valuemax="100" aria-valuetext="Loading"><i></i></div></div>
<div class="function-stat" data-file="named"><div class="stat-heading"><h3>Named</h3><div class="function-count"><strong id="files-named">—</strong></div></div><div class="function-track" role="progressbar" aria-label="Files named" aria-valuemin="0" aria-valuemax="100" aria-valuetext="Loading"><i></i></div></div>
</section>
</div>
<section id="project-map" data-kind="code" aria-label="Project map"><div class="map-controls"><label class="map-search"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><input id="map-search" type="search" placeholder="Search names" aria-label="Search map names" autocomplete="off" spellcheck="false"></label><div id="map-kind" class="map-toggle" data-selected="code" role="group" aria-label="Map type"><button type="button" data-kind="code" aria-pressed="true"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m8 7-5 5 5 5m8-10 5 5-5 5m-3-14-2 18"/></svg><span>Code</span></button><button type="button" data-kind="data" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.66 3.58 3 8 3s8-1.34 8-3V5M4 12c0 1.66 3.58 3 8 3s8-1.34 8-3"/></svg><span>Data</span></button></div></div><div class="map-view"><div id="canvas" class="canvas" aria-label="Code file map"></div><button id="map-back" type="button" hidden aria-label="Back to files"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m12 5-7 7 7 7M5 12h14"/></svg></button></div><div id="map-tooltip" class="map-tooltip" role="tooltip" hidden></div><aside id="map-details" class="map-details" aria-labelledby="map-details-title" hidden><div class="map-details-heading"><h3 id="map-details-title"></h3><button type="button" aria-label="Close map details"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><dl></dl></aside></section>
<section class="history-section" aria-labelledby="history-title">
<h2 id="history-title">Progress</h2>
<div class="history-summary"><span><i class="code-line-key"></i>Code <strong data-history-value="code"></strong></span><span><i class="data-line-key"></i>Data <strong data-history-value="data"></strong></span><time id="history-date"></time></div>
<div class="history-chart"><svg viewBox="0 0 1000 220" preserveAspectRatio="none" role="img" aria-label="Code and data linked progress over time"><g class="chart-guides"><path d="M0 20H1000 M0 80H1000 M0 140H1000 M0 200H1000"/></g><path class="history-line code-line" data-line="code"/><path class="history-line data-line" data-line="data"/><line id="history-cursor" y1="10" y2="200"/><circle data-dot="code" r="4"/><circle data-dot="data" r="4"/></svg><span class="history-ceiling"></span><input id="history-scrub" type="range" min="0" max="0" value="0" aria-label="Explore linked progress snapshots"></div><div class="history-axis"><span></span><span></span><span></span></div>
</section>
<section class="people-section" aria-labelledby="people-title"><h2 id="people-title">Contributors</h2><ol class="contributor-rankings" aria-label="Contributor rankings by credited compiled functions"></ol></section>
<section class="lower"><div><h3>Want to join the effort?</h3></div><a href="#"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4v10a4 4 0 0 0 4 4h4M16 4v4a4 4 0 0 1-4 4H8"/><circle cx="8" cy="4" r="2"/><circle cx="16" cy="4" r="2"/><circle cx="18" cy="18" r="2"/></svg><span>Start contributing</span><svg class="icon external-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M7 7h10v10"/></svg></a></section>
</main>
