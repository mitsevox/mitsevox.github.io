<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><meta name="description" content="Recover what the target supports, record it, and never manufacture a match."><title>Evidence · Wiki · mitsevox</title><link rel="stylesheet" href="/assets/style.css?v=2"><link rel="stylesheet" href="/assets/portfolio.css?v=5"><link rel="stylesheet" href="/assets/wiki.css?v=4"></head><body><noscript><article class="wiki-article"><h1 id="evidence">Evidence</h1>
<p>Recover what the target supports, record it, and never manufacture a match.</p>
<p>A byte match proves that the compiler produced the same code from the submitted source; it proves nothing about names, types, intent or where the original source file boundaries were. The project's value is the evidence behind those claims, so the evidence is recorded in the repository next to the configuration it supports and is reviewed with it.</p>
<h2 id="inventory-before-interpretation">Inventory before interpretation</h2>
<p>Inventory what the target and its references actually contain: the parsed filesystem, executables, symbols, debug information, linker maps, diagnostic strings, SDK references and related builds. Record hashes or revisions and which files were parsed. A claim that an artifact does not exist must say how thoroughly it was searched; a file-name search or a few strings is not enough.</p>
<p>Related builds (another platform, another revision, another game on the same engine) suggest names and behavior. They do not prove the target's offsets, field widths, original names or source boundaries. Keep target evidence, reference evidence and inferred meaning separate. A claim is per target, because it carries addresses: a name recovered on one target and carried to a sibling is a <code>related</code> row in the sibling's <code>evidence.tsv</code>, with <code>provisional</code> edges on its unit rows, until the sibling's own name and boundary evidence confirms it; a byte-identical link there is a matching claim only (<a href="/wiki/multi-target/">Multiple targets</a>).</p>
<p>Reference material that agents read on every task lives under <code>references/</code>: text only, regenerable by a named tool, no file over 4 MB. The scaffold check warns on anything larger.</p>
<h2 id="bounded-tasks">Bounded tasks</h2>
<p>Identify the functions, address ranges, candidate source unit, shared headers and dependencies before editing. Confirm accepted declarations on current <code>main</code>. Establish each function's full extent and the limits of any provisional unit; unresolved boundaries stay visible.</p>
<p>For a field or signature, cite the actual loads and stores and the relevant caller or callee behavior. A nearby subsystem's access is not proof of the same layout. Preserve unknown offsets instead of inventing a convenient struct.</p>
<h2 id="the-reconstruction-loop">The reconstruction loop</h2>
<ol>
<li>Describe the behavior and the evidence-backed types before optimizing for a score.</li>
<li>Write plausible source in the codebase's style.</li>
<li>Compile with the documented unit or library profile.</li>
<li>Compare the full function bytes, referenced data and relocations with objdiff.</li>
<li>Investigate the remaining uncertainty, record the result and retain useful partial source.</li>
</ol>
<div class="wiki-table"><table>
<thead>
<tr>
<th>Uncertainty</th>
<th>Useful investigation</th>
</tr>
</thead>
<tbody>
<tr>
<td>Behavior, references or ownership</td>
<td>Target disassembly and bounded static analysis</td>
</tr>
<tr>
<td>Different instruction selection or scheduling</td>
<td>Controlled compiler experiments and the compiler's intermediate output</td>
</tr>
<tr>
<td>Competing behavioral interpretations</td>
<td>A bounded debugger or emulator trace with known inputs and conditions</td>
</tr>
<tr>
<td>Candidate SDK or library reuse</td>
<td>Fingerprints followed by calls, globals, types and boundary checks</td>
</tr>
</tbody>
</table></div>
<p>Record the tested revision, tool version and settings, inputs, conclusion and remaining uncertainty. Check decompiler output against instructions. Runtime observations establish what happened under those conditions, not the original source text. Keep bulk experiments private; retain concise reproducible evidence publicly.</p>
<h2 id="the-evidence-record">The evidence record</h2>
<p>Each target keeps <code>config/&lt;target id&gt;/evidence.tsv</code>, one claim per row, tab separated:</p>
<pre><code class="language-text">kind  start  end  subject  origin  start_boundary  end_boundary  evidence
</code></pre>
<div class="wiki-table"><table>
<thead>
<tr>
<th>Column</th>
<th>Values</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>kind</code></td>
<td><code>name</code>, <code>function</code>, <code>data</code>, <code>unit-anchor</code>, <code>unit</code>, <code>type</code>, <code>field</code>, <code>external</code>, <code>compiler</code>, <code>assembly</code>, <code>source-form</code>, <code>linker</code></td>
</tr>
<tr>
<td><code>start</code>, <code>end</code></td>
<td>Virtual addresses as <code>0x</code> plus eight upper-case hex digits, end exclusive; <code>-</code> when unknown or inapplicable</td>
</tr>
<tr>
<td><code>subject</code></td>
<td>The symbol, source path, type or field concerned</td>
</tr>
<tr>
<td><code>origin</code></td>
<td><code>target</code> (present in the target's bytes, symbols or debug information), <code>signature</code> (a named tool signature), <code>related</code> (another identified build), <code>inferred</code> (interpretation of the code)</td>
</tr>
<tr>
<td><code>start_boundary</code>, <code>end_boundary</code></td>
<td><code>exact</code>, <code>provisional</code>, <code>open</code> or <code>-</code>, claimed independently of each other; anything but <code>-</code> only on <code>function</code>, <code>data</code>, <code>unit</code>, <code>assembly</code> and <code>linker</code> rows</td>
</tr>
<tr>
<td><code>evidence</code></td>
<td>A reproducible locator and what it establishes and leaves unknown</td>
</tr>
</tbody>
</table></div>
<p>Use separate rows for a name, a function extent, a field layout and a source-unit boundary: one claim never silently proves another. A <code>name</code> row with origin <code>target</code> needs explicit name evidence in the target; a name supported only by behavior is <code>inferred</code>. Compiler profiles are <code>compiler</code> rows at the unit or library level. The starter <code>config/README.md</code> is the full definition and goes into the repository as is.</p>
<h2 id="what-earns-a-row">What earns a row</h2>
<p>A row is a claim a person or agent made that a reviewer must be able to challenge: an <code>inferred</code> name, a <code>unit</code> boundary, a <code>type</code> or <code>field</code> layout read from loads and stores, a <code>compiler</code>, <code>source-form</code> or <code>linker</code> claim. Tool output is not transcribed row by row. Symbol extents from the toolkit, debug names from a related build, signature hits from a library map: these are reproducible from <code>references/</code> plus a tool at a pinned revision, so they get one row per tool run, with kind <code>unit-anchor</code> or <code>name</code>, origin <code>related</code> or <code>signature</code>, a subject that names the tool with its inputs and revision, and the regenerable report's path as the evidence. The table then stays readable in review, and the report is the evidence.</p>
<p><code>python3 tools/evidence.py check</code> runs in the <code>Tool tests</code> job and in the scaffold check: the header row, eight columns, the address format, the kinds and origins, edges only on the rows that have extents, non-empty subject and evidence. It checks form, not truth; the hostile checklist's <code>Names</code> row is the provenance check, and the publish action counts a function as named only when its symbol is not a tool label, so an unnamed function can never be published as named.</p>
<h2 id="matching-integrity">Matching integrity</h2>
<p>Do not force a match through:</p>
<ul>
<li>per-function flags, optimization pragmas or compiler attributes introduced to force code generation;</li>
<li>inline assembly, embedded instruction bytes or patched compiler output in place of compiled source;</li>
<li>invented helpers, casts, volatile qualifiers, padding or control flow whose only justification is the bytes;</li>
<li>altered symbol boundaries, excluded comparisons or progress categories that hide mismatches;</li>
<li>behavioral changes made to satisfy the compiler.</li>
</ul>
<p>Compiler versions and flags need evidence at the compilation-unit or library level. A function-specific exception needs evidence that the original used it and the owner's explicit approval. Originally handwritten assembly needs provenance. Labeling a workaround a fake match does not make it acceptable; it stays a local experiment outside accepted source.</p>
<p>When evidence runs out, keep the useful partial reconstruction as a <code>NonMatching</code> unit, keep the original bytes linked and record the gap. Partial similarity is progress; unsupported certainty is not.</p>
<h2 id="imported-and-sdk-code">Imported and SDK code</h2>
<p>Retain the origin, source revision, license and local modifications of anything imported, in <code>CREDITS.md</code> and under <code>licenses/</code>; a verbatim imported tree goes under <code>extern/</code> with its own credits. A fingerprint match is a candidate, especially for a short function; inspect target-specific calls, data ownership and compilation boundaries before importing. Imported code whose every name is <code>target</code>, <code>signature</code> or <code>related</code> is a tier B change: it gets the hostile review, not the blind accuracy pass.</p>
<p>Comments in source explain intent, invariants and non-obvious relationships. Matching scores, compiler experiments, agent notes and review history belong in <code>evidence.tsv</code> or the PR, never in source comments.</p></article><p>All chapters: <a href="/wiki/downloads/handbook.md">handbook.md</a></p></noscript><div class="shell"><p class="startup" role="status">Loading…</p></div><script>function startupFailed(){var s=document.querySelector(".shell");if(s&&!s.querySelector("header"))s.innerHTML='<p class="startup">The site could not load. <a href="">Reload</a></p>';}setTimeout(startupFailed,10000);addEventListener("error",function(){setTimeout(startupFailed,0);});addEventListener("unhandledrejection",function(){setTimeout(startupFailed,0);});</script><script type="module" src="/assets/app.js?v=8" onerror="startupFailed()"></script></body></html>
