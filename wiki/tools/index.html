<p>Tools worth knowing, grouped by the question each one answers, and what to check before a project relies on one.</p>
<p>This chapter recommends; it does not require anything beyond the base. Each project's agents decide which tools earn a place, by running the check on the tool's card against that project's own code. A tool that passes the check is pinned in the project (a version tag or a commit) and its licence is recorded in <code>CREDITS.md</code>. One that fails is left out, with the reason in the project's notes.</p>
<p>Every card says which toolchain the tool suits: CodeWarrior (<code>mwcc</code>, most GameCube games), ProDG (SN Systems' GCC 2.95, many EA and third-party games) or any. "Agent fit" says whether an agent can drive it: run from the command line, no screen, text output.</p>
<h2 id="the-base">The base</h2>
<p>These are the tools every project in this standard already uses. <a href="/wiki/build-verify-measure/">Build, verify, measure</a> covers how they fit together; this section says what each is for.</p>
<ul>
<li><strong>decomp-toolkit (dtk).</strong> Splits the original executable into objects, names functions it recognises by signature, writes the linker script and explains why a relinked file differs (<code>dol diff</code>). Also reads DWARF 1 (<code>dwarf dump</code>) and extracts files from a disc image. MIT.</li>
<li><strong>objdiff.</strong> Compares each compiled object with the original, produces the progress report and lists regressions between two reports. MIT or Apache-2.0.</li>
<li><strong>The compiler pack.</strong> The Metrowerks and ProDG compiler binaries that dtk-template downloads by default. See <a href="#risks-and-licences">Risks and licences</a>.</li>
<li><strong>wibo.</strong> Runs those Windows compilers on Linux and macOS. Open source.</li>
<li><strong>ninja.</strong> Runs the build.</li>
</ul>
<p>Keep the dtk and objdiff versions the same across a project's targets and say which version a result came from.</p>
<h2 id="test-one-variant-of-a-function">Test one variant of a function</h2>
<p><strong>objdiff one-shot diff.</strong> <code>objdiff-cli diff</code> with <code>-o -</code> prints one function's diff as JSON (<code>--format json</code>) instead of opening the viewer. It takes either two objects (<code>-1</code> target, <code>-2</code> base) or a project directory (<code>-p</code>) and a unit name (<code>-u</code>), then the function's symbol.</p>
<ul>
<li><strong>For:</strong> the inner loop of matching. A script compiles a scratch copy of the unit with the unit's own compile command from <code>build.ninja</code>, diffs the one function, and exits 0 when it is identical. No full rebuild, no report regeneration, and the source tree is never touched.</li>
<li><strong>Toolchain:</strong> any. <strong>Agent fit:</strong> good; structured output.</li>
<li><strong>Check before relying on it:</strong> for a few functions, the script's verdict agrees with the full build's report (identical where the report says 100%, different elsewhere).</li>
</ul>
<p>A trial script built this way is worth writing early in any project; the alternative, rebuilding the whole report for each variant, takes seconds per try instead of a fraction of one.</p>
<h2 id="get-a-first-c-draft">Get a first C draft</h2>
<p><strong>m2c</strong> (<a href="https://github.com/matt-kempster/m2c">matt-kempster/m2c</a>). Turns a function's assembly into C. Targets are written platform-compiler-language, for example <code>ppc-mwcc-c</code>; <code>--context</code> takes a header file for types (dtk-template's <code>decompctx.py</code> makes one), and <code>--valid-syntax</code> aims for output that compiles without edits. GPL-3.0.</p>
<ul>
<li><strong>For:</strong> many small and medium functions at the start of a project, or a function too long to write by hand from nothing. Run it over the unmatched functions under a size limit, compile each draft, keep the ones that match, and hand-fix the near misses.</li>
<li><strong>Toolchain:</strong> CodeWarrior is supported directly. Its GCC mode is written for MIPS; output for ProDG on PowerPC is untested.</li>
<li><strong>Agent fit:</strong> good; deterministic with <code>--deterministic-vars</code>.</li>
<li><strong>Limits:</strong> a draft is m2c's form, not the original's. It invents temporaries and casts, can add arguments that are not there, and can let a function fall off its end. A matching draft is still a draft: it needs the project's names, types and style before it is committed.</li>
<li><strong>Check before relying on it:</strong> on ten functions the project has already matched, how many m2c drafts compile and how close they come.</li>
</ul>
<h2 id="why-does-my-c-compile-differently">Why does my C compile differently?</h2>
<p><strong>mwcc-debugger</strong> (<a href="https://github.com/cadmic/mwcc-debugger">cadmic/mwcc-debugger</a>). Runs the compiler under a debugging emulator and writes out its internal state for one function: the parsed source, the code after each optimisation pass, and the register allocator's decisions. It turns "the registers are different" into a reason.</p>
<ul>
<li><strong>For:</strong> a function that is close but will not match, when the difference is register choice or instruction order. The dumps show which variable got which register and why; that points at the declaration, the expression or the loop shape the original used.</li>
<li><strong>Toolchain:</strong> CodeWarrior only. It runs two compiler versions: GC/1.1 (its README: "usually good enough for GC/1.0 - GC/1.2.5") and GC/2.6 ("usually good enough for GC/1.3.2 - GC/2.7"). Linux and macOS.</li>
<li><strong>Setup:</strong> gdb, cmake and Rust, and a build of encounter's <code>retrowin32</code> fork with GDB support. Done once per machine; not for CI.</li>
<li><strong>Licence:</strong> the repository has no licence file. Clone it at a pinned commit on each machine, record it as "no licence" in <code>CREDITS.md</code>, and do not copy it into a project repository.</li>
<li><strong>Limits:</strong> the dumps are facts about the compiler; what a project does with them is not. The usual shortcut, adding dead code that steers the allocator, is a fake match (<a href="/wiki/evidence/#matching-integrity">Evidence</a>).</li>
<li><strong>Check before relying on it:</strong> the project's compiler is not one of the two the debugger runs, so first compile the project's matched units with the debugger's version and compare. If they come out byte-identical, the dumps describe your compiler; if some differ, the dumps cannot be trusted for those.</li>
</ul>
<p><strong>GCC dump flags (ProDG).</strong> ProDG's compiler is GCC 2.95, which writes its internal representation after each pass when asked: <code>-da</code> for every pass, or single passes such as <code>-dr</code>, <code>-dc</code>, <code>-dS</code>, <code>-dg</code> and <code>-dR</code>. This is the ProDG counterpart of the debugger and needs nothing new.</p>
<ul>
<li><strong>For:</strong> the same questions on ProDG code: why a value lives in a different register, why an instruction moved.</li>
<li><strong>Setup:</strong> the compile wrapper has to pass the flags through to <code>cc1</code> and keep the dump files. Keep dumps private; they contain the game's code.</li>
<li><strong>Check before relying on it:</strong> that the project's <code>cc1</code> writes the dump files for one known function.</li>
</ul>
<p><strong>Compiler probe.</strong> Not a downloadable tool but a method worth a script in any project: compile a piece of source the original certainly contains (a public SDK or runtime function) under every candidate compiler version and flag set, and search the original executable for each result. The version whose output appears is the one the original used. The result is evidence for the compiler profile, recorded as such.</p>
<h2 id="search-for-a-near-miss-fix">Search for a near-miss fix</h2>
<p><strong>decomp-permuter</strong> (<a href="https://github.com/simonlindholm/decomp-permuter">simonlindholm/decomp-permuter</a>). Makes random changes to one function's source, compiles each, and keeps the ones that score closer to the original. It supports PowerPC and has a CodeWarrior compile example. MIT.</p>
<ul>
<li><strong>For:</strong> late in a function, when only register allocation differs.</li>
<li><strong>Toolchain:</strong> any it can compile; set up per project (a directory with the function, the original object, a compile script and a settings file).</li>
<li><strong>Agent fit:</strong> runs headless, but it is a random search: many cores, minutes to hours, and output that needs sorting.</li>
<li><strong>Limits:</strong> its own README warns that it "often finds lots of nonsensical changes that improve regalloc". Most of what it finds is a fake match. Use its result as a hint and rewrite the idea by hand in plausible C: a moved declaration, a value read once into a local, two statements swapped. Never commit its output.</li>
<li><strong>Check before relying on it:</strong> on a few near misses, how many of its hits survive being rewritten as plain C.</li>
</ul>
<p><strong>Declaration-order search.</strong> A narrower, deterministic search: try the orders of a function's local declarations and keep the one that matches. On CodeWarrior, register numbering follows declaration order, so this fixes a common class of register differences and cannot change what the code does. Any project can script it on top of its trial script.</p>
<h2 id="find-the-same-functions-in-another-build">Find the same functions in another build</h2>
<p>These answer "which functions here are the same as functions there": a second revision of the same game, a sequel or sibling game on the same engine, or a library shared between games. Results suggest names; they are <code>related</code> evidence, never proof (<a href="/wiki/multi-target/#carrying-a-map-to-a-new-target">Multiple targets</a>).</p>
<p><strong>coddog</strong> (<a href="https://github.com/ethteck/coddog">ethteck/coddog</a>). Finds identical and similar functions within one binary (<code>cluster</code>), between a function and a binary (<code>match</code>, <code>submatch</code>) and between projects (<code>compare2</code>, <code>compare-n</code>, marked experimental). MIT or Apache-2.0.</p>
<ul>
<li><strong>Toolchain:</strong> any. <strong>Agent fit:</strong> command line, text output.</li>
<li><strong>Limits:</strong> it reads a project description file (<code>decomp.yaml</code>) that dtk-template projects do not have, and its documentation shows no PowerPC example.</li>
<li><strong>Check before relying on it:</strong> a known answer. Run it between two revisions of the same game where a byte-identical relink already ties each function to its sibling, and count how many pairs it finds and how many it gets wrong.</li>
</ul>
<p><strong>Ghidra BSim.</strong> Part of Ghidra (Apache-2.0). Compares functions by what Ghidra's decompiler makes of them rather than by bytes, so it can pair functions that differ slightly in code. It needs Ghidra and a GameCube loader (<a href="https://github.com/Cuyler36/Ghidra-GameCube-Loader">Cuyler36/Ghidra-GameCube-Loader</a>, Apache-2.0, built from source against the Ghidra version in use).</p>
<ul>
<li><strong>For:</strong> the same job as coddog where the builds are further apart: another compiler version, another platform, small source changes.</li>
<li><strong>Agent fit:</strong> runs headless, but slowly: a full Ghidra analysis of each binary first.</li>
<li><strong>Check before relying on it:</strong> the same known-answer test as coddog.</li>
</ul>
<h2 id="what-does-this-code-do-in-the-game">What does this code do in the game?</h2>
<p><strong>Ghidra</strong> (Apache-2.0, with the loader above). Its decompiler and cross-references answer what a function does, who calls it and what data it touches. dtk and objdiff already give a project its split, its symbols and its assembly, so Ghidra is for understanding, not for matching. Keep Ghidra projects private; they contain the game.</p>
<p><strong>Dolphin.</strong> The GameCube emulator (GPL-2.0 or later); <code>dolphin-emu-nogui</code> runs without a window. A bounded trace answers what only running the game shows: a value at run time, which branch runs, what a function is for. It needs the owner's own disc image on the machine and is not for CI. Record what was traced, on which build, and what stays uncertain (<a href="/wiki/evidence/">Evidence</a>).</p>
<h2 id="risks-and-licences">Risks and licences</h2>
<ul>
<li><strong>The compiler pack.</strong> The Metrowerks and SN Systems compilers are proprietary. Every GameCube decompilation uses the community's redistributed pack, and a project that adopts this standard accepts that. Pin the pack by its file name and never commit a compiler to a project repository.</li>
<li><strong>Patched compilers.</strong> The pack includes community-patched builds (for example <code>GC/1.3.2r</code>). A patched compiler can be a useful tool, but output from it is never evidence of the original toolchain.</li>
<li><strong>Licences.</strong> Record each tool and its licence in <code>CREDITS.md</code>. A tool with no licence (mwcc-debugger) is used from its own clone on each machine and never copied into a repository.</li>
<li><strong>Private output.</strong> Dumps, traces, Ghidra projects and similarity databases contain the game's code. They stay on the machine or in the private build repository, like the originals.</li>
<li><strong>Fake matches.</strong> No tool here makes a forced match acceptable. A tool's result is a hint until it reads as plausible original source (<a href="/wiki/evidence/#matching-integrity">Evidence</a>).</li>
