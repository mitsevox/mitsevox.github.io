<p>Activating a second original safely, sharing one source tree between targets, carrying a map from one to the next, validating a change on every target, and the life of a target from listed to archived.</p>
<p>A target is one original binary (<a href="/wiki/targets/">Targets</a>). Everything in this guide is laid out for several targets from the first commit, so a second disc revision, region or platform adds a target and changes no file's shape. This chapter is the procedure for doing that, written so that it can be followed step by step with a pass or fail gate after each step. It is a procedure, not a validated one: nothing in it is validated end to end until two real targets of one repository have passed every gate. The kit's tools for it are tested on disposable fixtures only, and the chapter says so where it matters.</p>
<h2 id="what-is-shared-and-what-is-per-target">What is shared and what is per target</h2>
<div class="wiki-table"><table>
<thead>
<tr>
<th>Per target (<code>config/&lt;id&gt;/</code>, <code>orig/&lt;id&gt;/</code>, <code>build/&lt;id&gt;/</code>)</th>
<th>Shared (one copy)</th>
</tr>
</thead>
<tbody>
<tr>
<td>The toolkit inputs (<code>config.yml</code>, <code>splits.txt</code>, <code>symbols.txt</code>), <code>build.sha1</code>, <code>evidence.tsv</code>, <code>README.md</code>, and any project-specific inputs (a linker script template, say)</td>
<td><code>src/</code>, <code>include/</code>, <code>configure.py</code> (the union of units, with <code>MatchingFor</code> where a unit links on some targets only), <code>tools/</code>, <code>tests/</code>, <code>docs/</code>, <code>references/</code>, the three JSON files under <code>config/</code></td>
</tr>
<tr>
<td>The original in the private image at <code>/orig/&lt;id&gt;/...</code> and the data directory <code>data/&lt;slug&gt;/&lt;id&gt;/</code></td>
<td>The build image (one image holds every original), <code>validate.yml</code>, the site page</td>
</tr>
</tbody>
</table></div>
<p>A unit that exists on some targets only is absent from the other targets' <code>splits.txt</code>. A function present on one target only is an <code>#if VERSION_&lt;ID&gt;</code> block in the shared file. Nothing is copied between targets and nothing is inherited: each target's own objdiff report scores it (<a href="/wiki/build-verify-measure/">Build, verify, measure</a>).</p>
<h2 id="activating-a-second-target">Activating a second target</h2>
<p>The target is <code>GAME01-rev1</code> below; <code>GAME01-rev0</code> is the target active so far. Each step ends with a gate; a failed gate means stop, report what was seen, and change nothing to get past it.</p>
<p>Before step 3, whoever runs steps 3 to 6 has three things: a local copy, supplied by the owner, of every original the procedure builds, the existing target's included (step 4 builds it before and after the pin), each checked against its SHA-1 in <code>config/targets.json</code>; the toolchain of <a href="/wiki/build-environment/#local-builds">Build environment</a>, built or installed locally; and the owner's approval of the downloads the first build makes, where the project's rules ask for one (the first build downloads the tools <code>configure.py</code> pins). The activation pull request (steps 3 to 6; step 1's listing is a pull request of its own) opens as a draft with the branch's first commit, as <a href="/wiki/contribution-workflow/">Contribution workflow</a> asks for every change; step 6 completes it rather than opening it.</p>
<ol>
<li><strong>List it.</strong> In a pull request of its own (tier C), merged before step 3, unless the target was listed earlier: <code>config/targets.json</code> lists <code>GAME01-rev1</code> as <code>planned</code> (or <code>archived</code>, when it was listed and set aside earlier) with the original's SHA-1, and <code>config/GAME01-rev1/README.md</code> and <code>orig/GAME01-rev1/.gitkeep</code> exist. Gate: <code>python3 tools/targets.py check</code> passes and <code>python3 tools/versions.py check</code> passes.</li>
<li><strong>The original into the image, and the digest into <code>validate.yml</code></strong> (owner). Commit the original to the private repository under <code>orig/GAME01-rev1/</code> (and add it to that repository's README, which lists the originals the image holds), add its <code>COPY</code> and <code>sha1sum -c</code> lines to the Dockerfile and its line to the image workflow's verification, merge, and take the new digest from the run summary (<a href="/wiki/build-environment/">Build environment</a>). Then, in a pull request of your own on the public repository, replace the digest in the <code>BUILD_IMAGE</code> line of <code>validate.yml</code> and merge it: nobody but the owner changes the digest, and the new image still holds the first target, so CI stays green on it (tier C: no source changes). Gate: the image workflow is green on <code>main</code> and its summary prints <code>ghcr.io/owner/game-build@sha256:&lt;64 hex digits&gt;</code>; on <code>main</code>, <code>validate.yml</code> names that digest and <code>Validate GAME01-rev0</code> is green with it, its <code>List measuring tools</code> step included, which proves that the new image's tools still match the pins.</li>
<li><strong>Scaffold.</strong> <code>python3 tools/new_target.py GAME01-rev1</code> writes <code>config/GAME01-rev1/config.yml</code> and an empty <code>evidence.tsv</code>, and adopts the README placeholder and the <code>.gitkeep</code> that are already there. Gate: the tool prints <code>wrote</code> for <code>config.yml</code> and <code>evidence.tsv</code> and <code>adopted</code> for <code>README.md</code> (with its reminder to rewrite the placeholder) and <code>.gitkeep</code>; a <code>refusing to overwrite</code> line means the directory holds real content and the procedure stops. The tool runs once: run again after it wrote its files, it refuses the README, which is no longer the directory's only file, and that refusal needs no action.</li>
<li><strong>Pin the scope of every unit.</strong> <code>python3 tools/matching_scope.py pin GAME01-rev0</code> (every target active so far, all of them) rewrites every unconditional <code>Matching</code> in <code>configure.py</code> to <code>MatchingFor("GAME01-rev0")</code>: the new target inherits no claim, and on it every unit is <code>NonMatching</code> until proven. Gate, in two parts: the tool prints <code>pinned N Matching declaration(s)</code>, N being the count of <code>Object(Matching,</code> lines before the rewrite (a <code>Matching is used outside</code> or <code>Object calls whose first argument is not</code> line means a hand edit is needed first), and the existing target is unchanged: <code>python3 configure.py --version GAME01-rev0</code> before and after the rewrite writes identical <code>build.ninja</code> and <code>objdiff.json</code> (<code>cmp</code> reports no difference; the files are under <code>build/GAME01-rev0/</code> when the project's <code>tools/project.py</code> writes them there, or at the repository root with stock dtk-template, copied aside before the rewrite, <a href="/wiki/build-verify-measure/">Build, verify, measure</a>), and the build (<code>ninja -f build/GAME01-rev0/build.ninja</code>, or <code>ninja</code> with the root files) still ends with <code>build/GAME01-rev0/main.dol: OK</code>. The pin is matching state, not a claim, so it adds no evidence row on any target (<a href="/wiki/evidence/">Evidence</a>): its count and the <code>cmp</code> result belong in the pull request.</li>
<li><strong>The first split.</strong> This step reads the toolkit's output and can end in a toolkit or linker question; whoever runs it stops at the first mismatch and reports, and every change made to reach a byte-identical relink is the owner's decision, with its evidence row. In order:<ol>
<li>Set <code>status: active</code> on the new target in <code>config/targets.json</code>, nothing else: <code>configure.py</code> takes its version list from <code>tools/targets.py</code> and accepts active targets only. From here <code>python3 tools/targets.py check</code> fails on the target's missing files until the end of this step.</li>
<li>Copy the project-specific inputs from the sibling: the keys of <code>config/GAME01-rev0/config.yml</code> beyond the five the scaffold writes, each with its path changed to the new target (<code>mw_comment_version</code>, <code>ldscript_template</code> with the template file copied beside it, and so on), except an <code>extract</code> entry, which names a symbol the toolkit-generated map does not have yet. The toolkit patch the project builds with, and what its <code>tools/project.py</code> does for the first target (an entry point passed to the linker, say), apply as they are. Each copied key is a hypothesis until the relink is byte-identical; the new target's README records what was needed.</li>
<li>Write <code>config/GAME01-rev1/build.sha1</code> before the first build, because the build reads it: the hash check is <code>dtk shasum -c</code> against that file, and ninja stops on a missing input. One line in <code>sha1sum</code> format, the registry's SHA-1 and the built path separated by two spaces: <code>&lt;40 hex digits&gt;  build/GAME01-rev1/main.dol</code>. Gate: <code>python3 tools/targets.py check</code> now names only <code>symbols.txt</code> and <code>splits.txt</code> as missing.</li>
<li>With your own copy of the new original at <code>orig/GAME01-rev1/&lt;original path&gt;</code>, <code>python3 configure.py --version GAME01-rev1</code> (with <code>--dtk &lt;path&gt;</code> when the project builds a patched toolkit), then the first build (<code>ninja -f build/GAME01-rev1/build.ninja</code>). On a dtk-template project the first build runs the toolkit's analysis, which writes the initial <code>config/GAME01-rev1/symbols.txt</code> and <code>splits.txt</code>; dtk-template's Getting Started (<code>docs/getting_started.md</code>, Creating a New Project) describes that first run and says the project may not build yet at that point. Every unit is <code>NonMatching</code> on this target, so the link is the original's own objects relinked. Gate: the build ends with <code>build/GAME01-rev1/main.dol: OK</code>, and <code>python3 tools/targets.py check</code> passes. Keep the first build's whole output (<code>ninja -f build/GAME01-rev1/build.ninja 2&gt;&amp;1 | tee &lt;file outside the repository&gt;</code>, with <code>set -o pipefail</code> so the build's exit status is kept): the diagnosis of a mismatch reads it. The toolkit's analysis and <code>configure.py</code> print warnings on the way, such as a section the toolkit cannot rename, an <code>extab</code> it cannot locate, or <code>Missing configuration for &lt;unit&gt;</code> for units the new map does not name yet; they are normal for a toolkit-generated map and are not a failed gate. A mismatch here is reported with the toolkit's output; what the sibling's own first relink needed (its README) is the first candidate. One cause the sibling's README may already name is a function the linker needs by name that the new map gives only a tool label. With the Metrowerks linker, for instance, <code>mwld</code> places <code>_rom_copy_info</code> and <code>_bss_init_info</code> in the section of the global <code>__start</code>; without that name the section comes out shorter than the original's by those tables, everything after it shifts, and <code>dtk dol info</code> on the build fails or shows different section bounds. The fix, the owner's decision like every change in this step, gives the counterpart on the new target the sibling's name, found by structure (the call from the entry routine, say) and never by position alone, and records it as a <code>related</code> name row and a separate <code>function</code> row (origin <code>target</code>, start edge <code>exact</code> from the call that reaches it, end edge <code>provisional</code> from the toolkit's size). The byte-identical relink proves the bytes, not the name, so the name stays origin <code>related</code>.</li>
<li>Gate: <code>python3 tools/matching_scope.py show</code> lists no unit as <code>all</code>; the measurement (<code>ninja -f build/GAME01-rev1/build.ninja progress build/GAME01-rev1/report.json</code>) writes a report whose <code>measures.complete_code</code> and <code>measures.complete_data</code> are <code>0</code> or absent (the report omits zero values); <code>python3 tools/versions.py check</code> and <code>python3 tools/evidence.py check</code> pass. The measurement compiles every unit's source for objdiff, so a source file that needs a generated input (the header an <code>extract</code> entry produces) fails here until the new target has that input: a finding for the owner, not a reason to skip the measurement.</li>
</ol>
</li>
<li><strong>Activate.</strong> The default target stays what it was. Rewrite <code>config/GAME01-rev1/README.md</code> from the placeholder to the target's facts (what the first relink needed), add the target's row to the project README, and mark the draft pull request ready for review. It changes <code>configure.py</code>, <code>config/targets.json</code>, the new target's directory and the two READMEs, nothing under <code>orig/</code> or <code>build/</code>, and not <code>validate.yml</code>, whose digest the owner changed in step 2. The pull request is tier A, because it adds <code>splits.txt</code> and <code>symbols.txt</code>: its Scope line says so, and it needs CI green, one <code>Accuracy:</code> record and one <code>Hostile:</code> record, each with <code>Targets: GAME01-rev0, GAME01-rev1</code>. The accuracy record is the justified <code>N/A</code> form: every symbol name is the toolkit's and no name is proposed. When step 5 needed a name, that name is proposed: its rows are in the new target's <code>evidence.tsv</code>, the accuracy record reviews it instead of taking the <code>N/A</code> form, and the target's README says to reapply it after the map is regenerated, because regeneration writes tool labels again. The hostile checklist's <code>Unit boundaries</code> row asks for the splits' evidence, and a toolkit-generated map claims none; <code>config/README.md</code>'s rule for tool output applies as it stands: one row per tool run, kind <code>name</code> (the labels are the toolkit's; <code>unit-anchor</code> would claim a source path, which it does not), origin <code>signature</code> (a named tool and its signature set supplied them), both addresses and both edges <code>-</code>, the subject naming the toolkit with its version, the project's patch and the original's SHA-1, and the evidence the path of the regenerable output (<code>config/GAME01-rev1/symbols.txt</code> and <code>splits.txt</code>, regenerated by deleting both and building again) with the statement that every unit is auto-generated, every function name the toolkit's (a neutral label or a name from its built-in signatures) except the names step 5 recorded on their own rows, no source boundary is claimed and the relink is byte-identical. Anything copied in step 5.2 gets its own row (<code>linker</code> for a linker script template, say). CI builds both targets, because <code>configure.py</code> and <code>config/targets.json</code> are shared paths. Gate: <code>Validate GAME01-rev0</code> and <code>Validate GAME01-rev1</code> are both green, including <code>Check the report</code> for each, and <code>Validate targets</code> passes; <code>Tool tests</code> passes with <code>matching_scope.py check</code>, which fails from this pull request on, two targets being active, if any unit is declared <code>Matching</code> without naming targets (a unit pull request merged meanwhile can add one: re-run <code>python3 tools/matching_scope.py show</code> before the final push and pin what it lists as <code>all</code>); the scaffold check prints no warning about the new target's files; both records are posted on the final revision by reviewers who did not write the pull request.</li>
<li><strong>Publish.</strong> Merge (owner). Gate: the first <code>main</code> run's <code>Validate GAME01-rev1</code> job prints <code>published &lt;slug&gt;/GAME01-rev1 &lt;sha7&gt;</code> (the first seven characters of the merge commit); <code>data/&lt;slug&gt;/GAME01-rev1/latest.json</code> exists in the data repository with <code>summary.code.linked</code> and <code>summary.data.linked</code> at 0; the game page shows the target in the picker with its own measurement; the existing target's numbers are unchanged.</li>
<li><strong>Widen.</strong> From here every shared unit counts on the new target as soon as its <code>splits.txt</code> names the unit, the unit's <code>MatchingFor(...)</code> in <code>configure.py</code> names the new target (plain <code>Matching</code> is gone from a repository with two active targets, see below), and its <code>symbols.txt</code> gives the functions the same names; that is the map transfer below.</li>
</ol>
<p>Steps 1, 3, 4 and 6 are an agent's; steps 2 and 7 are the owner's; step 5 is for whoever can read the toolkit's output, with the owner deciding every change it turns out to need.</p>
<h2 id="shared-source-with-two-targets-and-with-more">Shared source with two targets and with more</h2>
<p>The convention is in <a href="/wiki/build-verify-measure/">Build, verify, measure</a>: one define per target, differences under <code>#if VERSION_&lt;ID&gt;</code> in the shared file, groups in <code>include/version.h</code>, whole-function variants when a function would carry three or more blocks or more than about a third of its lines inside blocks. Three things change when the third target is listed:</p>
<ul>
<li><strong>Conditions name their targets.</strong> A branch is broad when a target listed later would take it: its condition holds with every <code>VERSION_</code> token false (<code>!VERSION_X</code>, <code>!REGION_USA</code>), or it is the <code>#else</code> of a chain none of whose conditions does; <code>VERSION_X &amp;&amp; !VERSION_Y</code> is not broad. With two targets a broad branch means the other target and <code>versions.py check</code> warns; from the third listed target on it is an error, so the pull request that lists a third target rewrites every such block as <code>#elif VERSION_Y</code>, a list <code>VERSION_Y || VERSION_Z</code>, or a group. The check runs on <code>src/</code>, <code>include/</code> and <code>configure.py</code>, in <code>Tool tests</code> and in the scaffold check; <code>view</code> and <code>diff</code> resolve a broad branch like any other.</li>
<li><strong>Groups say what the targets share</strong>, not which they are: <code>REGION_USA</code>, <code>PLATFORM_WII</code>, <code>REV_LATER</code>. A group is defined once, in <code>include/version.h</code>, as a boolean expression of defines and earlier groups, and a difference shared by two or more targets uses the group rather than listing the ids in every file. <code>versions.py view --target &lt;id&gt; &lt;file&gt;</code> shows what one target compiles; a reviewer reads <code>versions.py diff --target &lt;a&gt; --target &lt;b&gt; &lt;file&gt;</code> for each pair the change touches.</li>
<li><strong>Whole-function variants</strong> stay the exception: one function-level <code>#if ... #elif ... #endif</code> per variant, in the same file, when inline blocks would make the function unreadable. Never a <code>src/&lt;id&gt;/</code> file for a unit two targets share.</li>
</ul>
<p>Per-target matching is <code>Object(MatchingFor("GAME01-rev0"), "unit.cpp")</code>, and a unit that links byte-identically on every active target lists all of them, <code>MatchingFor("GAME01-rev0", "GAME01-rev1")</code>: plain <code>Matching</code> is the form of a repository with one active target only, because it claims every target, one activated later included; <code>python3 tools/matching_scope.py show</code> lists the state, and the PR's Targets table reports the <code>Matching</code> state per target for each touched unit. From the second active target on, <code>python3 tools/matching_scope.py check</code> fails any unit declared <code>Matching</code> without naming targets, in <code>Tool tests</code> and in the scaffold check, so a unit pull request that would claim the new target by habit is caught before merge; <code>pin</code> is for the moment before activation only, and afterwards the targets a unit links on are a hand edit. Promotion on a target is a tier B change for that target; it needs the byte-identical link there, which CI proves.</p>
<p>Compiler and library profiles are per target when the targets were built differently: whole profiles chosen by <code>config.version</code> in <code>configure.py</code>, never a per-function or per-unit exception, with a <code>compiler</code> row in each target's <code>evidence.tsv</code> that names the compiler version, the flags and what established them (<a href="/wiki/evidence/">Evidence</a>). A profile change is tier A: <code>tools/tier.py</code> raises the floor for a <code>cflags</code>, <code>ldflags</code>, <code>asflags</code> or <code>mw_version</code> line, and the hostile checklist's <code>Compiler settings</code> row asks for the evidence at the right scope. The same profile on two targets is one profile with two evidence rows, one per target, because a claim is per target by definition.</p>
<h2 id="carrying-a-map-to-a-new-target">Carrying a map to a new target</h2>
<p>A new target starts with the toolkit's own <code>symbols.txt</code> and <code>splits.txt</code>: tool labels for every function, units where the toolkit found them. The sibling's map carries over function by function, and the result is a set of candidates, never target evidence, until evidence in the new target itself confirms each one, claim by claim; a byte-identical link confirms none of them (below). This section specifies the transfer; the tool that performs it is not built yet, because it needs a second original to be built against, and it is listed below as an unknown.</p>
<ol>
<li><strong>Anchor.</strong> For every function of the sibling that has a recovered name, find its counterpart in the new original by its body: the same instruction bytes with the fields the relocations fill masked (branch targets, address halves, small-data offsets), the relocations being the ones the toolkit records for each split object when it splits the original, the same source on both targets; the same size; the same shape of relocations. A sibling function with exactly one counterpart is a unique candidate; one with several is ambiguous; one with none is unmatched. A function of the new original that no sibling function reaches is unreached. Neither class says a function was removed or added: a body that does not match may have been edited, resized, inlined or compiled differently. A function is recorded as removed or added only on separate evidence: the new target's own symbols or debug information, or a reviewed <code>function</code> row in the new target's <code>evidence.tsv</code> that states the function's absence on the target that lacks it, with addresses <code>-</code> there, and how thoroughly it was searched (<a href="/wiki/evidence/">Evidence</a>); until then it stays unmatched or unreached.</li>
<li><strong>Propose.</strong> Unique candidates propose the name in the new target's <code>symbols.txt</code>, and a unit boundary in its <code>splits.txt</code> where every function of a sibling unit maps and the counterparts are contiguous in the new target's address order without interleaving with another unit's. Ambiguous, unmatched and unreached functions keep their tool labels and are listed. Nothing is guessed from position alone, and identical bodies are a legitimate ambiguity, not a fault: an ambiguous function becomes unique only on independent evidence, the reference check of step 3 leaving one candidate, or the new target's own symbols or debug information. The proposals are final only after step 3.</li>
<li><strong>Validate.</strong> Boundaries: a proposed unit's counterparts are contiguous and the sections agree (code stays code, data stays data). References: the check runs in two passes so that demotion and resolution cannot loop. A call or data reference from A to B in the sibling corresponds to the reference at the same place in A' in the new original: to B' when B is unique, to one of B's candidates when B is ambiguous. A reference to anything step 1 did not anchor (a function without a recovered name, or data) is neither a match nor a mismatch and is not counted in either pass. A reference that reaches a different function with its own counterpart, or a function outside an ambiguous B's candidates, is a mismatch. First, demotions: a unique candidate with a mismatched reference becomes ambiguous, keeping its step 1 candidates, repeated until no mismatch remains; this ends, because demotion never reverses and a demoted function's candidates still include its old counterpart, so no demotion creates a new mismatch. Then resolutions, once: only references from functions still unique after the demotions count, and an ambiguous function whose counted references single out one candidate becomes unique, with that reference named in the report, and a function resolved here resolves no other. A reference to an unmatched B is not a mismatch: when A' reaches an unreached X at the corresponding reference, X is a changed candidate for B, listed in the report with that reference and never proposed as a name. The relink of the new target stays byte-identical with every unit <code>NonMatching</code>, and <code>python3 tools/versions.py check</code> and <code>python3 tools/targets.py check</code> pass.</li>
<li><strong>Record.</strong> The tool writes one regenerable report under <code>config/&lt;new id&gt;/</code> (every function with its class, unique, ambiguous, unmatched or unreached; the sibling function or functions it maps to; and for an unreached function its changed candidacy, with the reference behind it) and the candidates go into <code>symbols.txt</code> and <code>splits.txt</code>, which are toolkit inputs, not claims. The evidence record gets one row per tool run, not one per function: kind <code>name</code> and kind <code>unit-anchor</code>, origin <code>related</code>, the subject naming the tool with its inputs and revision, the evidence the report's path, and <code>provisional</code> edges on the <code>unit</code> rows it proposes.</li>
<li><strong>Review.</strong> The transfer is one tier A pull request for the new target (<code>splits.txt</code> and <code>symbols.txt</code> change), reviewed against the new target's disassembly, with the report as the evidence and its ambiguous, unmatched and unreached lists and changed candidates as the open questions. Its Targets table shows the sibling unchanged.</li>
</ol>
<p>Matching state, names and boundaries stay three separate records after the transfer, on every target. A byte-identical link on the new target (<code>MatchingFor</code> widened to it) is a matching claim and nothing more: it proves the source compiles to that target's bytes, not the function's original name or where the original source file began and ended, since a split that crosses two original units still links when their order holds (<a href="/wiki/evidence/">Evidence</a>). So a transferred name stays origin <code>related</code>, and a proposed unit's edges stay <code>provisional</code>, whatever the link does. A name becomes origin <code>target</code> only when the new target's own symbols or debug information name the function, or a string the function itself references names it (an assertion or log message carrying its name), recorded as explicit name evidence. An edge becomes <code>exact</code> only when evidence in the new target's bytes establishes that boundary, recorded on its own row and reviewed like any other unit claim; a <code>__FILE__</code> string, the order of a unit's static data or the padding between units are evidence a reviewer weighs for an edge, not proof of it on their own. A function can link exactly on a target while its name there is still borrowed.</p>
<p>The tool is <code>tools/transfer_map.py &lt;from id&gt; &lt;to id&gt;</code> when it exists. Its tests must include a target transferred onto itself before the real pair, a run whose answer is known: every function with a recovered name maps to itself, as a unique candidate or inside an ambiguous set that contains it; each ambiguous set lies inside one group of functions step 1 cannot tell apart (identical masked bodies, sizes and relocation shapes; empty destructors, accessors, stubs and thunks occur in any executable), and a group member that step 3 resolves is unique to itself, with the singling reference named in the report; no function is unique to a counterpart other than itself; no candidate is demoted; nothing is unmatched; the unreached functions are exactly those without a recovered name that end in no ambiguous set (an unnamed function sharing the step 1 body of named functions stays in their ambiguous set, unless step 3 resolves them all); there are no changed candidates; and every unit whose functions are all unique comes out intact. A tool that reports a function unique while step 1 found several candidates, without naming the reference or the target's own symbols that singled it out, is breaking ties, which step 2 forbids. Its first real run is part of validating this chapter, and the real unknowns are what that run finds: the address deltas, the functions the compiler laid out differently, and whether the toolkit's analysis of the new original needs the same project patches as the first.</p>
<h2 id="validating-a-change-on-every-target">Validating a change on every target</h2>
<p>A shared change is safe for a target only when that target was built with it. The rule and its records are in <a href="/wiki/contribution-workflow/">Contribution workflow</a>; here is how CI and the author divide the work:</p>
<ul>
<li><strong>What CI builds.</strong> The planner builds every active target for a change under a shared path (<code>src/**</code>, <code>include/**</code>, <code>asm/**</code>, <code>configure.py</code>, <code>tools/**</code>, <code>validate.yml</code>, the three JSON files; <code>extern/**</code> or <code>tests/**</code> where the repository lists them) and only the owning target for a change confined to <code>config/&lt;id&gt;/**</code> or <code>orig/&lt;id&gt;/**</code> (<a href="/wiki/targets/">Targets</a>). So a pull request that touches <code>src/</code> is validated on every target by CI, and a pull request that touches one target's <code>splits.txt</code> is validated on that target alone, which is right, because no other target reads that file.</li>
<li><strong>The Targets table.</strong> One row per active target: built locally or <code>CI only</code>; byte-identical; the units touched with their <code>Matching</code> state on that target (<code>matching_scope.py show</code>); the progress delta from that target's report (linked, matched, exact functions, before and after); the evidence rows added to that target's file. A row that says <code>not affected</code> is only right for a change confined to another target's <code>config/&lt;id&gt;/</code>.</li>
<li><strong>Regressions.</strong> A unit that linked on a target and no longer does fails that target's build at the hash check; CI catches it before the table. A function that drops from exact without breaking the link is a negative delta in the table and a finding for the reviewer; a reviewer asks why a shared change moved a target it was not meant to touch.</li>
<li><strong>Reviewer coverage.</strong> Each record's <code>Targets:</code> line names the targets the reviewer checked; a record covering one target never counts for another, and a tier A pull request that changes a shared unit needs its records to name every active target the unit links on. A change to one target's map or profile needs records for that target.</li>
</ul>
<h2 id="the-life-of-a-target">The life of a target</h2>
<ul>
<li><strong>Listed.</strong> <code>planned</code> or <code>archived</code> in <code>config/targets.json</code>, with <code>config/&lt;id&gt;/README.md</code> and <code>orig/&lt;id&gt;/.gitkeep</code>. Nothing builds it; the page lists it without a measurement.</li>
<li><strong>Active.</strong> The steps above. Progress is not a condition: a target at 0 linked is active.</li>
<li><strong>Archived.</strong> Set <code>status: archived</code>. Its directory, its data directory and its history stay; publishing refuses it (<code>Target &lt;id&gt; is not an active target</code>) and the page lists it without a measurement. The default target must stay active, so change <code>defaultTarget</code> first when archiving the default. CI no longer builds it, so a shared change is not validated on it; an archived target's <code>MatchingFor</code> entries stay as they are, a record of what linked when it was last built.</li>
<li><strong>Reactivated.</strong> The activation steps again, from where the target stands. The owner restores its <code>COPY</code> and checksum lines in the Dockerfile if they were removed, and brings the digest to an image that holds it (step 2). Before it is active again, <code>python3 tools/matching_scope.py pin &lt;every target active now&gt;</code> pins the <code>Matching</code> declarations made while it was archived, which claim every target, to the targets that proved them; its own <code>MatchingFor</code> entries stay, a record of what linked when it was last built, but shared changes since then were never built on it. Then steps 5 and 6: the first build may fail at the hash check, and every unit it fails on is pinned back (its id removed from that unit's <code>MatchingFor</code>) until it is repaired, with the pull request's Targets table saying so. Its files must still be there (<code>targets.py check</code>). Its data directory continues where it stopped: the history gains rows from the next publish, and <code>latest.json</code> moves forward because the new commit is newer.</li>
<li><strong>Default target changed.</strong> Edit <code>defaultTarget</code>; the next publish of any active target rewrites <code>game.json</code>, the hub card and the page without <code>?target=</code> show the new default, and every <code>?target=&lt;id&gt;</code> URL still works.</li>
<li><strong>A failed or partial publication.</strong> Each target publishes in its own job and its own commit, so one target's failure never holds back another's. The publish is idempotent per revision: re-running the failed job (Actions, the run, re-run failed jobs) publishes the revision if it never reached the data repository, or prints <code>&lt;slug&gt;/&lt;id&gt; &lt;sha&gt; already published</code> if it did, and a run of an older commit that finishes late appends its history row without touching <code>latest.json</code>. A publish that pushed is complete: the files of a target are written together and committed once. A wrong published file is corrected in the data repository (<a href="/wiki/publishing/">Publishing</a>), never by re-running the measurement, which keeps what was published first.</li>
<li><strong>Histories.</strong> One history per target, from its first publish, never rewritten; a target id is permanent because it names that history. The disc revision (<code>revision</code> in <code>targets.json</code>, a display string) and the Git revision (<code>source.revision</code> in <code>latest.json</code>, the measured commit) are different things: a history row is one Git commit measured on one target, and the same commit has one row per active target.</li>
</ul>
<h2 id="what-has-been-validated-and-what-has-not">What has been validated, and what has not</h2>
<ul>
<li>The three kit tools (<code>matching_scope.py</code>'s <code>pin</code> and <code>check</code>, <code>new_target.py</code>'s adoption, <code>versions.py</code>'s broad-condition rule) are tested on disposable fixtures in <code>tests/test_targets.py</code>: a <code>configure.py</code> with the plain <code>Object(Matching, ...)</code> form, a scratch registry with two and three targets, a placeholder README. Those fixtures are not a second original.</li>
<li>The activation steps, the transfer specification and the lifecycle have not been run on two real targets of one repository. The first repository to do so validates this chapter, and its pull requests are the record; until then every statement above about what a step shows is what the code does on fixtures, not what a real second target did.</li>
