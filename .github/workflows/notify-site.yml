# Generated by tools/build_notifier.py; validator source is tools/notify_report.py.
name: Notify shared portfolio
on:
  workflow_call:
    inputs:
      project:
        type: string
        required: true
      producer_branch:
        type: string
        default: main
      producer_workflow:
        type: string
        required: true
      report_format:
        type: string
        default: report-v1
      site_repository:
        type: string
        required: true
      app_client_id:
        type: string
        required: true
    secrets:
      app_private_key:
        required: true
permissions:
  contents: read
jobs:
  notify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate completed main report event
        id: notification
        env:
          PROJECT: ${{ inputs.project }}
          PRODUCER_BRANCH: ${{ inputs.producer_branch }}
          PRODUCER_WORKFLOW: ${{ inputs.producer_workflow }}
          SITE_REPOSITORY: ${{ inputs.site_repository }}
          REPORT_FORMAT: ${{ inputs.report_format }}
        run: |
          python3 - <<'PY'
          """Embedded into the pinned notifier workflow; never check out producer code."""
          import json
          import os
          from pathlib import Path
          import re


          def notification(event, project, repository, branch, workflow, site, report_format="report-v1"):
              if not re.fullmatch(r'[a-z0-9]+(?:-[a-z0-9]+)*',project):
                  raise ValueError('Invalid project slug')
              if not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+',site):
                  raise ValueError('Invalid site repository')
              if report_format not in ('report-v1','report-v2'):raise ValueError('Unknown report format')
              run=event.get('workflow_run',{})
              if not (event.get('action')=='completed' and event.get('repository',{}).get('full_name')==repository
                      and run.get('head_repository',{}).get('full_name')==repository
                      and run.get('head_branch')==branch and run.get('path')==workflow
                      and run.get('event') in ('push','workflow_dispatch')
                      and run.get('status')=='completed' and run.get('conclusion') in (('success','failure') if report_format=='report-v2' else ('success',))
                      and type(run.get('id')) is int and 0<run['id']<2**63):
                  raise ValueError('Only the registered successful same-repository main workflow may notify')
              return {'event_type':'producer-report-ready','client_payload':{
                  'project':project,'repository':repository,'runId':run['id']}}


          def main():
              payload=notification(json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text()),
                  os.environ['PROJECT'],os.environ['GITHUB_REPOSITORY'],os.environ['PRODUCER_BRANCH'],
                  os.environ['PRODUCER_WORKFLOW'],os.environ['SITE_REPOSITORY'],os.environ.get('REPORT_FORMAT','report-v1'))
              path=Path(os.environ['RUNNER_TEMP'])/'report-notification.json'
              path.write_text(json.dumps(payload))
              with open(os.environ['GITHUB_OUTPUT'],'a') as output:
                  owner,name=os.environ['SITE_REPOSITORY'].split('/')
                  output.write('site_owner='+owner+'\nsite_name='+name+'\n')


          if __name__=='__main__':main()
          PY
      - name: Create site-scoped notification token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.app_private_key }}
          owner: ${{ steps.notification.outputs.site_owner }}
          repositories: ${{ steps.notification.outputs.site_name }}
          permission-contents: write
      - name: Request authenticated report refresh
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SITE_REPOSITORY: ${{ inputs.site_repository }}
        run: gh api --method POST "repos/$SITE_REPOSITORY/dispatches" --input "$RUNNER_TEMP/report-notification.json"
