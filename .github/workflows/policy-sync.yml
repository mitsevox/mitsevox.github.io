name: Producer policy sync

on:
  schedule:
    - cron: '11,41 * * * *'
  workflow_call:
    inputs:
      project:
        type: string
        default: ''
      dry_run:
        type: boolean
        default: false
    secrets:
      POLICY_SYNC_APP_PRIVATE_KEY:
        required: false
      POLICY_SYNC_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      project:
        description: 'Registered slug (empty checks all configured sources)'
        required: false
        type: string
      dry_run:
        description: 'Validate and retain proposal patches without opening PRs'
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: producer-policy-sync
  cancel-in-progress: false

jobs:
  propose:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' || vars.POLICY_SYNC_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: '0.12.9'
      - name: Create optional site-scoped App token
        id: app
        if: vars.POLICY_SYNC_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.POLICY_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.POLICY_SYNC_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Configure ephemeral GitHub authentication
        run: gh auth setup-git
      - name: Inspect sources and validate policy proposals
        env:
          POLICY_SYNC_WRITE_TOKEN: ${{ steps.app.outputs.token || secrets.POLICY_SYNC_TOKEN || github.token }}
          PROJECT: ${{ inputs.project }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--all)
          if [[ -n "$PROJECT" ]]; then args=(--project "$PROJECT"); fi
          if [[ "$DRY_RUN" != 'true' ]]; then args+=(--propose); fi
          uv run --locked python tools/sync_policies.py "${args[@]}"
      - name: Retain results and validated proposal patches
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: policy-sync-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/policy-sync
          if-no-files-found: warn
          retention-days: 30
