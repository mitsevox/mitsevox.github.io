name: Refresh producer reports

on:
  repository_dispatch:
    types: [producer-report-ready]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write
  actions: read

# Keep one pending batch. Every batch discovers all changed registered runs,
# so replacing pending notifications cannot lose a different project's update.
concurrency:
  group: producer-report-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'schedule' || vars.REPORT_REFRESH_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: portfolio-pages
      queue: max
    permissions:
      contents: write
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      policy_projects: ${{ steps.refresh.outputs.policy_projects }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: '0.12.9'
      - name: Authenticate notification and discover changed reports
        id: refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked python tools/refresh_reports.py
      - name: Assemble verified static output
        if: steps.refresh.outputs.publish == 'true'
        run: uv run --locked python tools/build_site.py
      - name: Preserve verified snapshots
        if: steps.refresh.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_SOURCE_SHA: ${{ steps.refresh.outputs.site_revision }}
        run: env GITHUB_SHA="$SITE_SOURCE_SHA" uv run --locked python tools/report_store.py publish
      - uses: actions/upload-pages-artifact@98ef48e41587a300b82de4cf298aa98b57b2faae
        if: steps.refresh.outputs.publish == 'true'
        with:
          path: build/site
      - name: Confirm site source is still current
        if: steps.refresh.outputs.publish == 'true'
        env:
          SITE_SOURCE_SHA: ${{ steps.refresh.outputs.site_revision }}
        run: env GITHUB_SHA="$SITE_SOURCE_SHA" uv run --locked python tools/report_store.py check-current
      - name: Deploy verified portfolio
        if: steps.refresh.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
      - name: Report sources retained at last-good data
        if: always() && steps.refresh.outcome == 'success'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('build/report-refresh.json').read_text())
          if result['failures']:
              print('Some sources failed; their last-good pointers were preserved. See the job summary.')
              raise SystemExit(1)
          PY
  policy:
    if: always() && needs.refresh.outputs.policy_projects != '' && needs.refresh.outputs.policy_projects != '[]'
    needs: refresh
    permissions:
      contents: write
      actions: read
      pull-requests: write
    uses: ./.github/workflows/policy-sync.yml
    secrets: inherit
