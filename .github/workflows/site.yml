name: Site

# The site is static: it renders whatever mitsevox/decomp-data publishes and builds nothing.
# Pull requests run the tests and the live-data check; main also deploys; the daily run checks the
# live data only.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'

permissions:
  contents: read

jobs:
  test:
    name: Test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Frontend syntax
        run: find assets -name '*.js' -print0 | xargs -0 -n1 node --check

  live-data:
    name: Live data
    # The published data must pass both readers at this revision, the publish checker and the
    # page's validator, so a check that gets stricter cannot strand what producers published, and
    # a bad publish is noticed within a day. Its own job, which the deploy does not wait for: a bad
    # publish in another repository must not block the site.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate the live data
        run: |
          git clone --quiet --depth 1 https://github.com/mitsevox/decomp-data live-data
          echo "data repository at $(git -C live-data rev-parse HEAD)"
          python3 tools/check_data_tree.py live-data

  deploy:
    name: Deploy
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Stage the site
        run: |
          mkdir -p _site/docs
          cp -r index.html 404.html assets wiki _site/
          cp -r docs/wiki _site/docs/
          cp -r redirects/. _site/
          # 404.html already renders every route; a real file per listed game serves it with
          # status 200, so game pages stay indexable. A game added later renders through the
          # 404 shell until the next deploy.
          for slug in $(python3 -c 'import json, urllib.request; print(*json.load(urllib.request.urlopen("https://mitsevox.github.io/decomp-data/index.json"))["games"])'); do
            mkdir -p "_site/games/$slug" && cp index.html "_site/games/$slug/"
          done
      - uses: actions/upload-pages-artifact@98ef48e41587a300b82de4cf298aa98b57b2faae
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
